<!DOCTYPE html>
<html lang="en-us">

</html>

<head>
    <meta charset="UTF-8">
    <title>Hayesville Trailer Sales Inc</title>
    <link rel="stylesheet" href="Styles.css">
</head>


<body>
    <script defer src="./index.js"></script>

    <div class="imageViewer">
        <div class="imageViewerContent">
            <button>
                <p>X</p>
            </button>
    
            <img src="./imgs/AL_SK_CHEVY_2.png">
        </div>
        
    </div>


    <div class="elementHolder">
        <div class="topBar">
            <b id="companyName">Hayesville Trailer Sales</b>

            <div class="topButtons">
                <button type="button" class="topButtons" id="aboutButton">
                    <b>About</b>
                </button>
            
                <button type="button" class="topButtons" id="contactButton">
                    <b>Contact us</b>
                </button>
            </div>

        </div>

        <div class="titleTextDiv">
            <strong id="mainTitle">Hayesville Trailer Sales Inc.</strong>

            <p id="titleDesc">Professional truck bed distributor and installer</p>
        </div>

        <div class="workGallery" id="workGallery">
        </div>

        <div class="locationInfo">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3267.7198665822475!2d-83.82698932496407!3d35.01371697281007!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x885f27f3e9f48c2d%3A0xd0fe05fd0494dbb8!2sHayesville%20Trailer%20Sales%20Inc.!5e0!3m2!1sen!2sus!4v1778786299694!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

            <div class="textBusinessInfoDiv">

                <div class="infoGroup">
                    <div class="infoHeading">
                        <p>Business Hours</p>
                        <img src="./icon/clock-orange.png">
                    </div>

                    <table id="businessHoursTable">
                        <tr>
                            <td>Monday - Friday</td>
                            <td>7:30AM - 5PM</td>
                        </tr>

                        <tr>
                            <td>Saturday - Sunday</td>
                            <td>Closed</td>
                        </tr>
                    </table>

                </div>

                <div class="infoGroup">
                    <div class="infoHeading">
                        <p>Business Phone</p>
                        <img src="./icon/phone-orange.png">
                    </div>

                    <p id="phoneNum">(828) 557-3204</p>
                </div>
                
            </div>
        </div>

        <div id="authorizedGallery">
            <div>
                <p>Authorized Installer For</p>
            </div>

            <div class="authorizedLogos">
                <img src="./imgs/NGX_LOGO_MINIMAL.jpg" alt="" id="NGXLOGOMIN">
                <img src="./imgs/CM_LOGO.jpg" alt="" id="CMLOGO">
            </div>
        </div>
        
        
    </div>

</body>
